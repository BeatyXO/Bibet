name: BIBET CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:contract
      - run: npm run test:direct
      - run: npm run test:allocations
      - run: npm run build
