name: BIBET CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  contract-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m genvm_linter.cli check contracts/bibet.py

  direct-mode:
    runs-on: ubuntu-latest
    env:
      GENVM_VERSION: v0.2.16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Cache GenVM bundle for genlayer-test
        shell: bash
        run: |
          cache_dir="$HOME/.cache/gltest-direct"
          mkdir -p "$cache_dir"
          curl --fail --location --retry 3 \
            "https://github.com/genlayerlabs/genvm/releases/download/${GENVM_VERSION}/genvm-universal.tar.xz" \
            --output "$cache_dir/genvm-universal-${GENVM_VERSION}.tar.xz"
      - run: pytest tests/direct -v

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:allocations
      - run: npm run test:static
